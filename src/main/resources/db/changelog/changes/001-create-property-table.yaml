databaseChangeLog:
  - changeSet:
      id: 001-create-property-table
      author: antigravity
      changes:
        - createTable:
            tableName: property
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: cep
                  type: varchar(20)
              - column:
                  name: address
                  type: varchar(255)
              - column:
                  name: city
                  type: varchar(100)
              - column:
                  name: state
                  type: varchar(50)
              - column:
                  name: country
                  type: varchar(100)
